name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek konfigurasi sudah diisi
        run: |
          if grep -n "PASTE_" index.html; then
            echo "::error file=index.html::CLIENT_ID / SCRIPT_URL di index.html masih placeholder. Isi dulu sebelum deploy."
            exit 1
          fi

      - name: Siapkan file situs
        run: |
          mkdir _site
          cp index.html _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
